name: Backend CI

on:
  push:
    branches: ['main']
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Backend
        run: npm run build:backend

      - name: Test Backend
        run: npm run test:backend

      - name: Lint Backend
        run: npx eslint apps/backend
